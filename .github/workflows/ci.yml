# Kjører kontrollene på hver pull request og hver push til main.
# Bruker ingen hemmeligheter: ingen produksjonsnøkler, ingen Supabase, ingen
# AI-kall. Databasetestene kjører mot PGlite (Postgres i minnet).
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontroll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Samme hovedversjon som lokalt. Testene kjører .ts direkte, som
          # krever typestripping i Node 23.6 eller nyere.
          node-version: 24
          cache: npm

      - name: Installer avhengigheter
        run: npm ci

      - name: TypeScript
        run: npx tsc --noEmit -p .

      - name: Lint
        run: npm run lint

      - name: Enhetstester
        run: npm test

      - name: Databasetester (PGlite)
        run: npm run test:db

      - name: Produksjonsbygg
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder

      - name: Produksjonsavhengigheter
        run: npm audit --omit=dev --audit-level=high
